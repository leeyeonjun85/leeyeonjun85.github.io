<!-- URL 복사 -->
<script>
    function CopyUrlToClipboard() {
        var dummy = document.createElement("input");
        var text = location.href;

        document.body.appendChild(dummy);
        dummy.value = text;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);

        let selectedID = document.querySelector('.btn--primary');
        let CreateDiv = document.createElement('div');
        
        CreateDiv.innerHTML = 'URL 복사 완료🔗';
        CreateDiv.id = 'snackbar';
        selectedID.appendChild(CreateDiv);
        CreateDiv.className = "show";
        
        setTimeout(function () { CreateDiv.className = CreateDiv.className.replace("show", ""); }, 3000);
    }
</script>



<style>
    #snackbar {
        visibility: hidden;
        min-width: 250px;
        margin-left: -125px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 5px;
        padding: 16px;
        position: fixed;
        z-index: 1;
        left: 50%;
        bottom: 30px;
    }

    #snackbar.show {
        visibility: visible;
        -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
        animation: fadein 0.5s, fadeout 0.5s 2.5s;
    }
    @-webkit-keyframes fadein {
        from { bottom: 0; opacity: 0; }
        to { bottom: 30px; opacity: 1; }
    }
    @keyframes fadein {
        from { bottom: 0; opacity: 0; }
        to { bottom: 30px; opacity: 1; }
    }
    @-webkit-keyframes fadeout {
        from { bottom: 30px; opacity: 1; }
        to { bottom: 0; opacity: 0; }
    }
    @keyframes fadeout {
        from { bottom: 30px; opacity: 1; }
        to { bottom: 0; opacity: 0; }
    }
</style>




<!-- Mermaid 다이어그램 (```mermaid 코드블록이 있는 글에서만 로드) -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var blocks = document.querySelectorAll('.language-mermaid');
    if (!blocks.length) return; // 다이어그램 없으면 mermaid 미로딩 (성능)
    blocks.forEach(function (el) {
      var code = el.querySelector('code') || el;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      el.parentNode.replaceChild(div, el);
    });
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
    s.onload = function () {
      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
      mermaid.run();
    };
    document.head.appendChild(s);
  });
</script>
